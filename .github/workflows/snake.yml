name: Generate Red Snake ⛩️

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate red-themed contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/red-snake.svg?color_snake=#2b1a18&color_dots=#f6ebe0,#f2b8a8,#e07060,#c8102e,#8c0a1e
            dist/red-snake-dark.svg?color_snake=#f6e8e0&color_dots=#1a0f12,#5a1820,#8c1c26,#c8263a,#ff4d5a&color_background=#0d1117

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
