name: Generate Sakura Snake 🌸

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate sakura-themed contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sakura-snake.svg?color_snake=#e0507e&color_dots=#fdeef3,#ffd6e3,#ffbad0,#f092b4,#c75b8a
            dist/sakura-snake-dark.svg?color_snake=#ff9ec0&color_dots=#161b33,#4a3a64,#7a4f7e,#c07ea0,#ffbad0&color_background=#0d1117

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
