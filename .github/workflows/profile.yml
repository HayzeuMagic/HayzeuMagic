name: Refresh profile stats ⛩️

# Rebuilds every number on the profile (contributions, streaks, repositories,
# languages) from live GitHub data, so the README never shows stale stats.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/make_panels.py

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate panels and README numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate from live data
        run: python assets/make_panels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/panels
          git diff --cached --quiet || git commit -m "Refresh profile stats" && git push
